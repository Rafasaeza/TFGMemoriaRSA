# =============================================================================
# Unified Telemetry Bridge Configuration (Telegraf)
# Bridges:
#   1. Edge Ingestion: MQTT (Mosquitto) -> Kafka (Redpanda `fleet-vda5050-state`)
#   2. Operational Persistence: Kafka (`fleet-features`, `fleet-anomalies`) -> QuestDB (HTTP ILP :9000)
# =============================================================================

[agent]
  interval = "1s"
  flush_interval = "1s"
  omit_hostname = true
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000

# -----------------------------------------------------------------------------
# 1. EDGE INGESTION: MQTT -> Redpanda
# -----------------------------------------------------------------------------

[[inputs.mqtt_consumer]]
  servers = ["${MQTT_BROKER_URL}"]
  topics = ["uagv/v2/+/+/state"]
  client_id = "telegraf-vda5050-bridge"
  qos = 1
  persistent_session = true
  data_format = "value"
  data_type = "string"
  name_override = "mqtt_vda5050_state"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "uagv/v2/+/+/state"
    tags = "_/_/source_manufacturer/source_serial_number/message_type"

[[processors.template]]
  namepass = ["mqtt_vda5050_state"]
  order = 0
  tag = "source_asset_key"
  template = '{{ .Tag "source_manufacturer" }}:{{ .Tag "source_serial_number" }}'

[[outputs.kafka]]
  namepass = ["mqtt_vda5050_state"]
  brokers = ["${KAFKA_BROKER}"]
  topic = "${KAFKA_TOPIC_VDA5050_STATE}"
  routing_tag = "source_asset_key"
  idempotent_writes = true
  compression_codec = 4
  max_retry = 5
  startup_error_behavior = "retry"
  data_format = "template"
  template = '{{ .Field "value" }}'

  [outputs.kafka.headers]
    source_serial_number = '{{ index .Tags "source_serial_number" }}'
    source_manufacturer = '{{ index .Tags "source_manufacturer" }}'
    source_asset_key = '{{ index .Tags "source_asset_key" }}'
    message_type = '{{ index .Tags "message_type" }}'
    mqtt_topic = '{{ index .Tags "topic" }}'

# -----------------------------------------------------------------------------
# 2. PERSISTENCE PIPELINE: Redpanda -> QuestDB (ILP over HTTP)
# -----------------------------------------------------------------------------

# Consumer 1: Silver fleet-features
[[inputs.kafka_consumer]]
  brokers = ["${KAFKA_BROKER}"]
  kafka_version = "2.8.0"
  topics = ["${KAFKA_TOPIC_FLEET_FEATURES}"]
  consumer_group = "telegraf-questdb-fleet-features"
  offset = "oldest"
  max_undelivered_messages = 5000
  data_format = "json_v2"
  [[inputs.kafka_consumer.json_v2]]
    measurement_name = "fleet_features"
    timestamp_path = "timestamp"
    timestamp_format = "2006-01-02T15:04:05.999Z07:00"

    [[inputs.kafka_consumer.json_v2.tag]]
      path = "manufacturer"
      optional = true
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "agv_id"
      optional = true
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "vehicle_key"
      optional = true
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "map_id"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "pos_x"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "pos_y"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "vx"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "omega"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "driving"
      type = "bool"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "battery_charge"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "battery_health"
      type = "int"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "battery_voltage"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "battery_current"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "battery_temperature"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "charging"
      type = "bool"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "motor_current"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "motor_voltage"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "motor_temperature"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "motor_speed_rad_s"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "motor_torque_nm"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "motor_power_w"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "back_emf_v"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "vibration_rms"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "fault_active"
      type = "bool"
      optional = true


# Consumer 2: Gold fleet-anomalies
[[inputs.kafka_consumer]]
  brokers = ["${KAFKA_BROKER}"]
  kafka_version = "2.8.0"
  topics = ["${KAFKA_TOPIC_AI_ANOMALIES}"]
  consumer_group = "telegraf-questdb-fleet-anomalies"
  offset = "oldest"
  max_undelivered_messages = 5000
  data_format = "json_v2"

  [[inputs.kafka_consumer.json_v2]]
    measurement_name = "fleet_anomalies"
    timestamp_path = "timestamp"
    timestamp_format = "2006-01-02T15:04:05.999999Z07:00"

    [[inputs.kafka_consumer.json_v2.tag]]
      path = "manufacturer"
      optional = true
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "agv_id"
      optional = true
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "vehicle_key"
      optional = true
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "model_name"
      optional = true
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "model_version"
      optional = true
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "classification"
      optional = true
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "top_feature_1"
      optional = true
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "top_feature_2"
      optional = true
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "top_feature_3"
      optional = true

    [[inputs.kafka_consumer.json_v2.field]]
      path = "anomaly_score"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "warning_threshold"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "anomaly_threshold"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "top_feature_1_contrib"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "top_feature_2_contrib"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "top_feature_3_contrib"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "window_start"
      type = "string"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "window_end"
      type = "string"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "top_features_summary"
      type = "string"
      optional = true

# Output: InfluxDB Line Protocol (ILP) to QuestDB HTTP :9000/write
[[outputs.influxdb]]
  namepass = ["fleet_features", "fleet_anomalies"]
  urls = ["${QUESTDB_ILP_URL}"]
  database = "qdb"
  skip_database_creation = true
  timeout = "5s"

# Health check HTTP endpoint for Docker healthcheck and Platform Services Portal
[[outputs.health]]
  service_address = "http://:8086"
