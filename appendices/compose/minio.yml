services:

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-admin123456}
    volumes:
      - minio-data:/data
    ports:
      - "19000:9000"
      - "9001:9001"
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/minio
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY:-admin} $${S3_SECRET_KEY:-admin123456};
      mc mb --ignore-existing local/lakehouse;
      exit 0;
      "
    networks:
      - lakehouse-net

volumes:
  minio-data:

networks:
  lakehouse-net:
