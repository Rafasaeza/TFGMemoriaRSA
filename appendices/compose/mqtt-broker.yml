services:
  mosquitto:
    image: eclipse-mosquitto:latest
    ports:
      - "1883:1883"
      - "${MQTT_WS_PORT:-9883}:9883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-p", "1883", "-t", "healthcheck", "-m", "1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mqtt-net

  telegraf:
    image: telegraf:1.39-alpine
    restart: unless-stopped
    command: telegraf --config /etc/telegraf/conf/telegraf.conf
    volumes:
      - ./telegraf:/etc/telegraf/conf:ro
    environment:
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-tcp://mosquitto:1883}
      KAFKA_BROKER: ${KAFKA_BROKER:-redpanda:9092}
    depends_on:
      mosquitto:
        condition: service_healthy
    networks:
      - mqtt-net
      - redpanda-net

volumes:
  mosquitto-data:
