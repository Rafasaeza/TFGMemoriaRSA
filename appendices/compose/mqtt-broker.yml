services:
  mosquitto:
    image: eclipse-mosquitto:latest
    ports:
      - "1883:1883"
      - "${MQTT_WS_PORT:-9883}:9883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-p", "1883", "-t", "healthcheck", "-m", "1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mqtt-net

volumes:
  mosquitto-data:
