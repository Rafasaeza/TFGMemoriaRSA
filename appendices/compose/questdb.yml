services:
  questdb:
    image: questdb/questdb:9.4.3
    environment:
      QDB_PG_READONLY_USER_ENABLED: "true"
      QDB_PG_READONLY_USER: grafana
      QDB_PG_READONLY_PASSWORD: grafana
      QDB_LINE_TCP_ENABLED: "false"
    ports:
      - "9000:9000"
      - "8812:8812"
    volumes:
      - questdb-data:/var/lib/questdb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9003/status"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - questdb-net

  questdb-init:
    image: curlimages/curl:8.21.0
    depends_on:
      questdb:
        condition: service_healthy
    volumes:
      - ./init.sh:/init.sh:ro
      - ./schema:/schema:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    networks:
      - questdb-net

volumes:
  questdb-data:
